script:
heart_rate_led_indicator:
  alias: Heart rate LED indicator
  mode: restart
  description: Presence-gated HR gradient + pulsing red + white when no HR/low HR + off if HR stuck 20s.
  sequence:
    - variables:
        hr_entity: sensor.seeed_studio_mr60bha2_kit_614adc_real_time_heart_rate
        presence_entity: binary_sensor.seeed_studio_mr60bha2_kit_614adc_person_information
        led_entity: light.ikea_led_strip

        hr: "{{ states(hr_entity) | float(0) }}"
        present: "{{ is_state(presence_entity, 'on') }}"

        # If HR doesn't change for this long (seconds), turn off
        stale_seconds: 20

        # Thresholds
        min_hr: 60
        y1_hr: 80
        y2_hr: 100
        max_hr: 150
        danger_hr: 150

        # Clamp HR for gradient math (>=60 only)
        hr_clamped: >
          {% set v = hr | float %}
          {% if v < min_hr %} {{ min_hr }}
          {% elif v > max_hr %} {{ max_hr }}
          {% else %} {{ v }}
          {% endif %}

        # Gradient color calculation (60-100 green->yellow, 100-120 yellow->orange, 120-150 orange->red)
        rgb: >
          {% set v = hr_clamped | float %}
          {% if v <= y1_hr %}
            {% set t = (v - min_hr) / (y1_hr - min_hr) %}
            {% set r = (0   + (255 - 0)   * t) | round(0) %}
            {% set g = 255 %}
            {% set b = 0 %}
            [{{ r }}, {{ g }}, {{ b }}]
          {% elif v <= y2_hr %}
            {% set t = (v - y1_hr) / (y2_hr - y1_hr) %}
            {% set r = 255 %}
            {% set g = (255 + (165 - 255) * t) | round(0) %}
            {% set b = 0 %}
            [{{ r }}, {{ g }}, {{ b }}]
          {% else %}
            {% set t = (v - y2_hr) / (max_hr - y2_hr) %}
            {% set r = 255 %}
            {% set g = (165 + (0 - 165) * t) | round(0) %}
            {% set b = 0 %}
            [{{ r }}, {{ g }}, {{ b }}]
          {% endif %}

    - choose:
        # 🚫 No person detected -> light OFF
        - conditions:
            - condition: template
              value_template: "{{ not present }}"
          sequence:
            - service: light.turn_off
              target:
                entity_id: "{{ led_entity }}"

        # 🤍 Person detected, but no heartbeat (<=0) OR HR below 60 -> WHITE
        - conditions:
            - condition: template
              value_template: "{{ present and (hr <= 0 or hr < min_hr) }}"
          sequence:
            - service: light.turn_on
              target:
                entity_id: "{{ led_entity }}"
              data:
                rgb_color: [255, 255, 255]
                brightness: 255
                transition: 1

        # 🚨 Person detected, dangerous HR -> pulse RED
        - conditions:
            - condition: template
              value_template: "{{ present and (hr > danger_hr) }}"
          sequence:
            - repeat:
                while:
                  - condition: template
                    value_template: >
                      {{ is_state(presence_entity, 'on')
                         and (states(hr_entity) | float(0) > danger_hr)
                         and ((as_timestamp(now()) - as_timestamp(states[hr_entity].last_changed)) < stale_seconds) }}
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: "{{ led_entity }}"
                    data:
                      rgb_color: [255, 0, 0]
                      brightness: 255

                  - delay: "00:00:01"

                  - service: light.turn_on
                    target:
                      entity_id: "{{ led_entity }}"
                    data:
                      rgb_color: [255, 0, 0]
                      brightness: 40

                  - delay: "00:00:01"

            # If we exited because HR got "stuck" for 20s, turn OFF
            - choose:
                - conditions:
                    - condition: template
                      value_template: >
                        {{ is_state(presence_entity, 'on')
                           and (states(hr_entity) | float(0) > 0)
                           and (states(hr_entity) | float(0) == hr)
                           and ((as_timestamp(now()) - as_timestamp(states[hr_entity].last_changed)) >= stale_seconds) }}
                  sequence:
                    - service: light.turn_off
                      target:
                        entity_id: "{{ led_entity }}"

      default:
        # ✅ Person detected + HR in 60..150 -> gradient
        - service: light.turn_on
          target:
            entity_id: "{{ led_entity }}"
          data:
            rgb_color: "{{ rgb }}"
            brightness: 255
            transition: 1

        # 🕒 Watchdog: if HR doesn't change for 20s, turn OFF
        - delay:
            seconds: "{{ stale_seconds }}"
        - choose:
            - conditions:
                - condition: template
                  value_template: >
                    {{ is_state(presence_entity, 'on')
                       and (states(hr_entity) | float(0) > 0)
                       and (states(hr_entity) | float(0) == hr)
                       and ((as_timestamp(now()) - as_timestamp(states[hr_entity].last_changed)) >= stale_seconds) }}
              sequence:
                - service: light.turn_off
                  target:
                    entity_id: "{{ led_entity }}"


automation:
- id: '1736284509123'
  alias: Heart rate -> Ikea LED Strip color
  mode: restart
  trigger:
    - platform: state
      entity_id:
        - sensor.seeed_studio_mr60bha2_kit_614adc_real_time_heart_rate
        - binary_sensor.seeed_studio_mr60bha2_kit_614adc_person_information
  action:
    - service: script.heart_rate_led_indicator
